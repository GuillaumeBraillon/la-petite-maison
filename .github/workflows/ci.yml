name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Check formatting
        run: npm run format:check
      - name: TypeScript build
        run: npm run tsc
      - name: Run lint
        run: npm run lint

  notify-deploy:
    runs-on: ubuntu-latest
    needs: test # attend que les tests passent
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check version change
        id: version_check
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          PREVIOUS_VERSION=$(git show HEAD^:package.json | node -e "let data = ''; process.stdin.on('data', chunk => data += chunk).on('end', () => console.log(JSON.parse(data).version))")
          echo "Current version: $CURRENT_VERSION"
          echo "Previous version: $PREVIOUS_VERSION"
          if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send deploy notification
        if: steps.version_check.outputs.changed == 'true'
        run: |
          curl -X POST \
            "${{ secrets.SUPABASE_FUNCTIONS_URL }}/notify-deploy" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -d '{"source": "github-actions"}'
